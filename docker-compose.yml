services:
  frontend:
    build:
      context: .
      dockerfile: ./containers/frontend.Dockerfile
      target: dev
    stop_signal: SIGINT
    profiles:
      - dev
    volumes:
      - ./system/frontend/:${FRONTEND_SRC_DIR:-/opt/builder}
      - shared_build:/opt/builder/dist

  backend:
    build:
      context: .
      dockerfile: ./containers/backend.Dockerfile
      target: dev
      additional_contexts:
        system: ./system
    stop_signal: SIGINT
    profiles:
      - dev
    ports:
      - 127.0.0.1:${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}
    volumes:
      - ./system/backend/:${BACKEND_SRC_DIR:-/opt/app}
      #- ./system/PLP_directRNA_design_V2/PLP_directRNA_design_package/:${BACKEND_SERVICE_DIR:-/opt/app_service}/PLP_directRNA_design_package
      #- ./system/PLP_directRNA_design_V2/codes/:${BACKEND_SERVICE_DIR:-/opt/app_service}/codes
      - ./test-data/plp/:${BACKEND_SERVICE_DIR:-/home/plp_data}
      - shared_build:/opt/app/static

  app:
    build:
      context: .
      dockerfile: ./containers/backend.Dockerfile
      target: prod
      additional_contexts:
        system: ./system
    stop_signal: SIGINT
    profiles:
      - prod
    ports:
      - 127.0.0.1:${BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}
    volumes:
      - ./test-data/plp/:${BACKEND_SERVICE_DIR:-/home/plp_data}

volumes:
  shared_build:
